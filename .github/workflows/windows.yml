name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A rising version per build lets the installer recognise it as an update of the installed app.
      - run: npm pkg set version=0.1.${{ github.run_number }}
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Matzio-Setup
          path: dist/*.exe
          if-no-files-found: error
      # Every build of main becomes a release, so the newest installer is always on the Releases page.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Matzio build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows installer built from ${{ github.sha }}.
            Download **Matzio-Setup.exe** below. Windows may warn because it isn't code-signed: click "More info", then "Run anyway".
          files: dist/Matzio-Setup.exe
