<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>

  <!-- Poster cards fading off to the right, like a catalog row -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
    <rect x="860" y="85" width="128" height="192" rx="16" fill="url(#card)" opacity="0.95"/>
    <rect x="1004" y="85" width="128" height="192" rx="16" fill="url(#card)" opacity="0.6"/>
    <rect x="1148" y="85" width="128" height="192" rx="16" fill="url(#card)" opacity="0.3"/>
  </g>
  <g fill="#ffffff">
    <rect x="860" y="292" width="96" height="9" rx="4.5" fill-opacity="0.35"/>
    <rect x="860" y="310" width="60" height="7" rx="3.5" fill-opacity="0.15"/>
    <rect x="1004" y="292" width="84" height="9" rx="4.5" fill-opacity="0.22"/>
    <rect x="1004" y="310" width="52" height="7" rx="3.5" fill-opacity="0.1"/>
    <rect x="1148" y="292" width="90" height="9" rx="4.5" fill-opacity="0.12"/>
  </g>
  <!-- Continue-watching progress on the first card -->
  <rect x="874" y="259" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="874" y="259" width="60" height="4" rx="2" fill="#ececee" fill-opacity="0.8"/>

  <!-- App mark: glass disc with a play glyph -->
  <circle cx="190" cy="200" r="92" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <path d="M170 160 L236 200 L170 240 Z" fill="#ececee" stroke="#ececee" stroke-width="12" stroke-linejoin="round"/>

  <text x="320" y="205" fill="#f2f2f4" font-family="Segoe UI Variable Display, Segoe UI, -apple-system, Inter, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="600" letter-spacing="-2">Matzio</text>
  <text x="324" y="252" fill="#9a9aa2" font-family="Segoe UI, -apple-system, Inter, Helvetica Neue, Arial, sans-serif" font-size="24" letter-spacing="0.3">A calm, dark media center for Windows</text>
  <text x="324" y="286" fill="#6a6a72" font-family="Segoe UI, -apple-system, Inter, Helvetica Neue, Arial, sans-serif" font-size="18" letter-spacing="2">STREMIO ADDONS · DEBRID · TRAKT</text>
</svg>
